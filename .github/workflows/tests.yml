name: Testes

# Só em push e PR na main, e com timeout curto, para gastar poucos minutos do GitHub Actions.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Linux é o runner mais barato (multiplicador 1x); Windows e macOS consomem mais minutos.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
